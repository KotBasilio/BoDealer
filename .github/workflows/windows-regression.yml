name: Windows regression tests

on:
  push:
  pull_request:

jobs:
  legacy-windows:
    name: Legacy Visual Studio build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build legacy solution
        run: msbuild sln/Bo/Bo.sln /m /p:Configuration=Debug /p:Platform=x64

      - name: Run regression smoke test
        shell: pwsh
        run: >-
          ./tests/windows/missing-config.ps1
          -WalrusPath ./sln/Bo/x64/Debug/Walrus.exe

      - name: Run invalid configuration tests
        shell: pwsh
        run: >-
          ./tests/windows/invalid-config.ps1
          -WalrusPath ./sln/Bo/x64/Debug/Walrus.exe

      - name: Run deterministic calculation test
        shell: pwsh
        run: >-
          ./tests/windows/successful-calculation.ps1
          -WalrusPath ./sln/Bo/x64/Debug/Walrus.exe

      - name: Run recovered statistical calculation test
        shell: pwsh
        run: >-
          ./tests/windows/statistical-calculation.ps1
          -WalrusPath ./sln/Bo/x64/Debug/Walrus.exe
